<!doctype html><html lang="en"><head><meta charset="utf-8"><title>desuper</title>
<script>
  // Старые приглашения /mayak/b/<token> переехали на desuper-app.web.app/b/<token>.
  var m = location.pathname.match(/^\/mayak\/b\/([A-Za-z0-9_-]{8,64})\/?$/);
  location.replace(m ? "https://desuper-app.web.app/b/" + m[1] : "https://desuper-app.web.app/");
</script></head>
<body><p><a href="https://desuper-app.web.app/">desuper-app.web.app</a></p></body></html>
